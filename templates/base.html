<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1">

        <title>EcoPath AI</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Font Awesome -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap"
            rel="stylesheet">
        <!-- AOS -->
        <link href="https://unpkg.com/aos@2.3.4/dist/aos.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <div class="d-flex" id="wrapper">

            <!-- Sidebar -->
            <div id="sidebar-wrapper">
                <div class="sidebar-heading">
                    <i class="fa-solid fa-earth-asia"></i>EcoPath AI
                </div>
                <div class="list-group">
                    <a href="/"
                    class="list-group-item">
                        <i class="fa-solid fa-house"></i>Dashboard
                    </a>
                    <a href="/news"
                    class="list-group-item">
                        <i class="fa-solid fa-newspaper"></i>Climate News
                    </a>
                    <a href="/analysis"
                    class="list-group-item">
                        <i class="fa-solid fa-robot"></i>AI Analysis
                    </a>
                    <a href="/planner"
                    class="list-group-item">
                        <i class="fa-solid fa-calendar-check"></i>Lifestyle Planner
                    </a>
                </div>
            </div>

            <!-- Page -->
            <div id="page-content-wrapper">
                <!-- Navbar -->
                <nav class="navbar navbar-expand-lg shadow-sm">
                    <div class="container-fluid">
                        <h1 class="m-0" style="color: #2D8131;"><b>
                            <i class="fa-solid fa-seedling fa-sm"></i> EcoPath AI</b>
                        </h1>
                        <button class="btn btn-success">
                            <i class="fa-solid fa-leaf"></i>
                            Sustainable Living
                        </button>
                    </div>
                </nav>
                
                <!-- Content -->
                <main class="container-fluid py-4">
                    {% block content %}
                    {% endblock %}
                </main>
            </div>
        </div>

        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
        <!-- AOS -->
        <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
        <script>
            AOS.init({
            duration:700
            });
        </script>
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    </body>
</html>
